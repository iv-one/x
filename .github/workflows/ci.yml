name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # buf breaking compares against the previous release tag.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: Test
        run: go test -race ./...
      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
      - name: Lint protos
        run: |
          buf lint
          buf format --diff --exit-code
      - name: Generated code is current
        run: |
          buf generate
          git diff --exit-code
      - name: No breaking change since the last release
        run: |
          prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -n "$prev" ]; then buf breaking --against ".git#tag=$prev"; fi

  # A v* tag is a release: the Go module is the tag itself, and the protos go
  # to buf.build/iv-one/entity under the same label.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install buf
        uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - name: Push to the BSR
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
        run: buf push --label "$GITHUB_REF_NAME"
